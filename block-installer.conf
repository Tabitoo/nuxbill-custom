# The web installer doesn't check whether PHPNuxBill is already installed,
# and install/ is copied back into the image on every build. Once config.php
# exists, deny the installer scripts so nobody can re-run it and overwrite
# config.php / re-import the database. Checked per request, so it applies
# right after the first install without restarting the container.
#
# step5.php stays reachable: step4.php writes config.php and then sends the
# admin to step5.php, which only copies pages_template/ to pages/ and shows
# the "installed" message (no database or config.php access).
<Directory /var/www/html/install>
    <FilesMatch "\.(php|sql)$">
        <If "-f '/var/www/html/config.php' && %{REQUEST_FILENAME} !~ m#/step5\.php$#">
            Require all denied
        </If>
    </FilesMatch>
</Directory>
