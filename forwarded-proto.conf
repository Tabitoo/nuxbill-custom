# When a reverse proxy / tunnel (e.g. Cloudflare Tunnel) terminates HTTPS and
# forwards plain HTTP to this container, it sends "X-Forwarded-Proto: https".
# Expose that to PHP as $_SERVER['HTTPS'] = 'on' so config.php builds APP_URL
# with https:// (otherwise CSS/JS links are http:// and the browser blocks them
# as mixed content). Done here rather than in config.php because the installer
# writes config.php from its own template, which doesn't handle the header.
SetEnvIfNoCase X-Forwarded-Proto "^https$" HTTPS=on
